<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b5cf6"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker>
  </defs>
  <rect width="880" height="330" rx="22" fill="#0b0a1f"/>
  <text x="440" y="46" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">Every change takes the same road.</text>

  <g font-size="15" text-anchor="middle">
    <g transform="translate(30 90)"><rect width="120" height="70" rx="14" fill="#17143a" stroke="#38bdf8"/><text x="60" y="32" font-weight="700" fill="#fff">Preview</text><text x="60" y="52" font-size="12" fill="#a5a3c9">diff, values hidden</text></g>
    <g transform="translate(176 90)"><rect width="120" height="70" rx="14" fill="#17143a" stroke="#a78bfa"/><text x="60" y="32" font-weight="700" fill="#fff">You approve</text><text x="60" y="52" font-size="12" fill="#a5a3c9">ID bound to the diff</text></g>
    <g transform="translate(322 90)"><rect width="120" height="70" rx="14" fill="#17143a" stroke="#a78bfa"/><text x="60" y="32" font-weight="700" fill="#fff">Back up</text><text x="60" y="52" font-size="12" fill="#a5a3c9">journal first</text></g>
    <g transform="translate(468 90)"><rect width="120" height="70" rx="14" fill="#17143a" stroke="#818cf8"/><text x="60" y="32" font-weight="700" fill="#fff">Apply</text><text x="60" y="52" font-size="12" fill="#a5a3c9">atomic writes</text></g>
    <g transform="translate(614 90)"><rect width="120" height="70" rx="14" fill="#17143a" stroke="#60a5fa"/><text x="60" y="32" font-weight="700" fill="#fff">Verify</text><text x="60" y="52" font-size="12" fill="#a5a3c9">every step</text></g>
    <g transform="translate(760 90)"><rect width="90" height="70" rx="14" fill="#06281d" stroke="#34d399"/><text x="45" y="40" font-weight="800" fill="#6ee7b7">Done ✓</text></g>
  </g>
  <g stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#a)">
    <path d="M150 125 H172"/><path d="M296 125 H318"/><path d="M442 125 H464"/><path d="M588 125 H610"/><path d="M734 125 H756"/>
  </g>

  <path d="M674 162 V214 H446" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#r)"/>
  <text x="686" y="196" font-size="13" fill="#fca5a5">step fails</text>
  <g transform="translate(296 192)"><rect width="150" height="48" rx="12" fill="#2a0d16" stroke="#f87171"/><text x="75" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#fecaca">↩ Auto rollback</text></g>

  <g font-size="13.5" fill="#a5a3c9">
    <text x="40" y="280">• Change a file after preview and the approval stops working</text>
    <text x="40" y="302">• Killed mid-run? <tspan fill="#e5e7eb">rollback &lt;runId&gt;</tspan> restores from the journal</text>
    <text x="470" y="280">• Your later edits are never overwritten by rollback</text>
    <text x="470" y="302">• Byte-identical restore, CRLF and BOM included</text>
  </g>
</svg>
